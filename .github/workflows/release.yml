name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish-python:
    runs-on: [self-hosted, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" python/pyproject.toml
      - run: pip install build twine
      - run: python -m build python
      - run: >
          twine upload
          --repository-url "http://10.10.0.3:8081/"
          -u "${{ secrets.REGISTRY_USER }}"
          -p "${{ secrets.REGISTRY_PASSWORD }}"
          python/dist/*

  publish-npm:
    runs-on: [self-hosted, worker]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm install
      - run: npm run build
      - name: Configure registry auth
        run: |
          AUTH=$(printf '%s:%s' "${{ secrets.REGISTRY_USER }}" "${{ secrets.REGISTRY_PASSWORD }}" | base64)
          echo "//10.10.0.3:4873/:_auth=${AUTH}" > ~/.npmrc
      - run: npm publish --registry "http://10.10.0.3:4873/"

name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish-python:
    runs-on: [self-hosted, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" python/pyproject.toml
      - run: uv build python
      - run: >
          uv tool run twine upload
          --repository-url "http://10.10.0.3:8081/"
          -u "${{ secrets.REGISTRY_USER }}"
          -p "${{ secrets.REGISTRY_PASSWORD }}"
          python/dist/*

  publish-npm:
    runs-on: [self-hosted, worker]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm install
      - run: npm run build
      - name: Configure registry auth
        run: |
          set -euo pipefail
          TOKEN=$(curl -s -u "${{ secrets.REGISTRY_USER }}:${{ secrets.REGISTRY_PASSWORD }}" \
            -X PUT "http://10.10.0.3:4873/-/user/org.couchdb.user:${{ secrets.REGISTRY_USER }}" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"${{ secrets.REGISTRY_USER }}\",\"password\":\"${{ secrets.REGISTRY_PASSWORD }}\"}" \
            | node -pe "JSON.parse(require('fs').readFileSync(0, 'utf8')).token")
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ] || [ "$TOKEN" = "undefined" ]; then
            echo "Échec de l'authentification Verdaccio : pas de token reçu"
            exit 1
          fi
          echo "//10.10.0.3:4873/:_authToken=${TOKEN}" > ~/.npmrc
          echo "//10.10.0.3:4873/:always-auth=true" >> ~/.npmrc
      - run: npm publish --registry "http://10.10.0.3:4873/"

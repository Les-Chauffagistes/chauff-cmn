[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chauff-cmn"
version = "0.1.0"
description = "Types partagés et wrapper de logging pour les microservices Les Chauffagistes"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "loguru>=0.7",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
aiohttp = [
    "aiohttp>=3.9",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "aiohttp>=3.9",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chauff_cmn"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
